[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "attack-surface-scanner"
version = "0.2.0"
description = "Non-intrusive attack surface and transport security scanner for SaaS applications"
requires-python = ">=3.10"
dependencies = [
  "typer>=0.12",
  "pydantic>=2.0",
  "requests>=2.31",
  "dnspython>=2.4",
  "httpx>=0.27",
  "rich>=13.0",
  "cryptography>=42.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.10",
  "respx>=0.21"
]

[project.scripts]
asm = "asm.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Typer's documented style is to call Option()/Argument() in the signature.
"src/asm/cli.py" = ["B008"]
[tool.mypy]
python_version = "3.10"
packages = ["asm"]
mypy_path = "src"
warn_unused_ignores = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["dns.*"]
ignore_missing_imports = true
